baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'R Workshop'
theme = 'hugo-theme-relearn'

[params]
    disableSearch = true
    disableLandingPageButton = true
    ordersectionsby = "weight"
    disableInlineCopyToClipBoard = true
    disableAnchorCopy = true
    disableAnchorScrolling = true

[params.author]
    name = 'Dan Yavorsky'

# More than one variant here is what makes Relearn render the theme
# switcher in the sidebar footer. The first entry is the default: 'auto'
# follows the reader's OS appearance setting.
[[params.themeVariant]]
    auto = ['zen-light', 'zen-dark']
    identifier = 'zen-auto'
    name = 'Auto (OS setting)'

[[params.themeVariant]]
    identifier = 'zen-light'
    name = 'Light'

[[params.themeVariant]]
    identifier = 'zen-dark'
    name = 'Dark'